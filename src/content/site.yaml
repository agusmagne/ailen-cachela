# =============================================================================
# CONTENIDO DEL SITIO — único archivo editable. Se valida en build con
# src/lib/schema.ts: si falta un campo, hay una fecha mal escrita o una URL
# inválida, `npm run build` falla con el detalle.
#
# Reglas:
# - Solo datos verificados. Lo PROBABLE o faltante va vacío ("") o comentado.
# - Un campo `url` vacío oculta el botón/link correspondiente.
# - Los textos con es/en van en los dos idiomas.
# =============================================================================

# Interruptor global del CONTENIDO DE EJEMPLO. true = se muestran los ítems inventados (`demo: true` en los
# archivos de src/content/*.yaml), siempre rotulados como "contenido de ejemplo". false = desaparecen, y las
# páginas que quedan sin nada se ocultan del menú. Al construir se puede pisar con DEMO_CONTENT=0 o 1.
# ANTES DE PUBLICAR EN main: decidir con la artista y poner false.
demo_content: true

site:
  name: Ailén Cachela
  # Color de la barra del navegador en móvil: igual a --bg de src/styles/tokens.css
  theme_color: "#050506"
  title:
    es: "Ailén Cachela | DJ y productora, Buenos Aires"
    en: "Ailén Cachela | DJ & producer, Buenos Aires"
  description:
    es: "DJ y productora de Buenos Aires, Argentina. Co-fundadora de fragmento.techno. Lanzó en el sello ROOM."
    en: "DJ & Producer from Buenos Aires, Argentina. Co-founder of fragmento.techno. Releases on ROOM."

artist:
  name: Ailén Cachela
  role:
    es: DJ y productora
    en: DJ & producer
  city: Buenos Aires
  country: Argentina
  country_code: AR
  # FALTA: género. Ninguna fuente lo define; no usar subgénero. Si la artista
  # confirma "Techno", completar acá (se publica en JSON-LD).
  genre: ""

hero:
  # Foto o video de la artista: dejar el archivo en src/assets/media/ y poner
  # acá solo el nombre (ej. "hero.jpg" o "hero.mp4"). Vacío = hero tipográfico.
  media: ""
  media_alt:
    es: ""
    en: ""
  # Para video: imagen de póster obligatoria (también en src/assets/media/).
  poster: ""

# Redes. El texto visible usa el handle real de CADA plataforma (no unificar).
# nav/contact/footer/same_as: dónde aparece. url vacía = no se muestra.
links:
  - id: instagram
    platform: Instagram
    label: ""
    handle: "@ailucachela"
    url: "https://www.instagram.com/ailucachela/"
    nav: true
    contact: true
    footer: true
    same_as: true
  - id: soundcloud
    platform: SoundCloud
    label: ""
    handle: "ailen-cachela"
    url: "https://soundcloud.com/ailen-cachela"
    nav: true
    contact: true
    footer: true
    same_as: true
  - id: senka-instagram
    platform: Instagram
    label: SENKA
    handle: "@senka.1919"
    url: "https://www.instagram.com/senka.1919/"
    nav: false
    contact: true
    footer: false
    same_as: false
  - id: linktree
    platform: Linktree
    label: ""
    handle: "ailencachela"
    url: "https://linktr.ee/ailencachela"
    nav: false
    contact: true
    footer: true
    same_as: true
  - id: pinterest
    platform: Pinterest
    label: ""
    handle: "ailncachela"
    url: "https://ar.pinterest.com/ailncachela/"
    nav: false
    contact: true
    footer: false
    same_as: true
  # PENDIENTE de la artista (no mostrar hasta tener URL real):
  # - Spotify, YouTube (playlist "Ahogo [ROOM.004]"), Beatport, Threads, Facebook, X
  # - SoundCloud de SENKA: soundcloud.com/senka1919 (PROBABLE, sin abrir)
  # - Instagram de fragmento.techno: @fragmento.techno (PROBABLE, perfil sin abrir)

listen:
  profile_url: "https://soundcloud.com/ailen-cachela"
  # id del ítem de `tracks` que va en el reproductor (facade). Vacío = sin reproductor.
  # Pendiente (artista): debe elegir cuál destacar; hoy es el primero de la lista.
  featured: mesdar
  # kind: unclassified | track | set. Hasta que la artista lo indique, todos
  # quedan "unclassified" (se rotulan "En SoundCloud").
  tracks:
    - id: mesdar
      title: "Mesdar Festival Worldwide Connection 18-04-2020"
      url: "https://soundcloud.com/ailen-cachela/mesdar-festival-worldwide-connection-18-04-2020"
      kind: unclassified
    - id: dubbin-rain
      title: "Dubbin' rain"
      url: "https://soundcloud.com/ailen-cachela/dubbin-rain"
      kind: unclassified
    - id: sophie
      title: "Sophie"
      url: "https://soundcloud.com/ailen-cachela/sophie"
      kind: unclassified
    - id: worlds-tears
      title: "World's tears in your eyes"
      url: "https://soundcloud.com/ailen-cachela/worlds-tears-in-your-eyes"
      kind: unclassified
    # PENDIENTE: "Untitled 001 | Techno Session" (aparece en Linktree, sin URL ni plataforma).

releases:
  - id: ellas-ep
    title: "Ellas EP [ROOM.004]"
    catalog: "ROOM.004"
    label:
      name: ROOM
      url: "https://roomarg.bandcamp.com/"
    date: "2017-10-20"
    format:
      es: "Digital · pagás lo que quieras"
      en: "Digital · name your price"
    # Compilación de distintas artistas. NO es un EP propio de Ailén.
    compilation:
      artists:
        - Euyinn
        - Josefina Muñoz
        - Miss Adk
        - SO
        - Dunkel Dame
        - Mica Pert
        - Ailén Cachela
    own_tracks:
      - number: 7
        title: "Ahogo (Original Mix)"
        duration: "07:56"
    # Portada: la de Bandcamp existe pero no hay permiso de uso confirmado.
    # Cuando haya permiso, dejar el archivo en src/assets/media/ y poner el nombre.
    cover: ""
    cover_alt:
      es: "Portada de Ellas EP [ROOM.004]"
      en: "Cover of Ellas EP [ROOM.004]"
    url: "https://roomarg.bandcamp.com/album/ellas-ep-room-004"
    # PENDIENTE: Beatport de "Ahogo" y playlist de YouTube (sin URL).

projects:
  - id: senka
    name: SENKA
    visible: true
    status:
      es: "En desarrollo"
      en: "Work in progress"
    text:
      es: "Proyecto artístico de Ailén."
      en: "Ailén's artistic project."
    handle: "@senka.1919"
    platform: Instagram
    url: "https://www.instagram.com/senka.1919/"
  - id: fragmento
    name: fragmento.techno
    visible: true
    status:
      es: ""
      en: ""
    text:
      es: "Colectivo del que Ailén es co-fundadora."
      en: "Collective co-founded by Ailén."
    handle: "@fragmento.techno"
    platform: Instagram
    # PROBABLE: https://www.instagram.com/fragmento.techno/ (perfil sin abrir).
    url: ""
  - id: room
    name: ROOM
    visible: true
    status:
      es: ""
      en: ""
    text:
      es: "Sello de Buenos Aires, Argentina, donde Ailén lanzó “Ahogo”."
      en: "Label from Buenos Aires, Argentina, where Ailén released “Ahogo”."
    handle: "roomarg"
    platform: Bandcamp
    url: "https://roomarg.bandcamp.com/"

# Fechas. Se leen solas de un calendario público de iCloud al compilar el sitio
# (ver "Cómo cargar una fecha" en README.md). Se recompila cada pocas horas.
# - calendar_url: link público del calendario (https:// o webcal://). Vacío = solo `manual`.
#   Se puede pisar al compilar con la variable de entorno SHOWS_CALENDAR_URL.
# - manual: fechas sueltas opcionales (date YYYY-MM-DD, venue, city, country ISO alpha-2, url
#   opcional). Si coinciden en fecha y nombre con una del calendario, gana la del calendario.
# Sin fechas en ningún lado = estado "Sin fechas anunciadas por ahora."
# No cargar acá "Mesdar Festival Worldwide Connection": vive en Escuchar.
shows:
  calendar_url: "https://p138-caldav.icloud.com/published/2/MTg3NzI1Mjg3NTgxODc3MrQcBkMNFPE9kAmjEkSzqrRYHPIKW0yUrtQZh9TGApTS9SGGO4PGo4yGIlV_BJm1ZjAuHj-wIJGbY4UXOex_5Ok"
  manual: []

