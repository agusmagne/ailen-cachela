  bio:
    es: "DJ y productora de Buenos Aires, Argentina. Co-fundadora de fragmento.techno. Lanzó en el sello ROOM. Proyecto artístico: SENKA."
    en: "DJ & Producer from Buenos Aires, Argentina. Co-founder of fragmento.techno. Releases on ROOM. Artistic project: SENKA."
  # Bio larga (se muestra con "Leer más"). FALTA: pendiente de la artista.
  bio_long:
    es: ""
    en: ""
  # Foto de prensa: archivo en src/assets/media/. Vacío = solo texto.
  photo: ""
  photo_alt:
    es: ""
    en: ""

contact:
  email: "ailen.cachela@gmail.com"
  # Publicar el email en el JSON-LD requiere autorización de la artista.
  email_in_jsonld: false

