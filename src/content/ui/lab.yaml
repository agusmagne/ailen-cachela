# ---- Hub -------------------------------------------------------------------------------------
lab_title: { es: "Lab", en: "Lab" }
lab_desc: { es: "Instrumentos y visuales que funcionan en tu navegador: secuenciador techno, visualizador del cromo líquido, scratch con el vinilo y generador de flyers. Todo el sonido se sintetiza ahí mismo.", en: "Instruments and visuals that run in your browser: a techno sequencer, a liquid chrome visualizer, vinyl scratch and a flyer generator. All the sound is synthesized right there." }
lab_lead: { es: "Un taller de juguetes serios. El sonido se genera en tu navegador (ningún archivo de audio), nada suena sin que lo pidas y nada de lo que hagas sale de tu equipo.", en: "A workshop of serious toys. Sound is generated in your browser (no audio files), nothing plays unless you ask and nothing you make leaves your device." }
