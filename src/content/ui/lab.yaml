lab_hub_tools: { es: "Herramientas", en: "Tools" }
lab_hub_how: { es: "Cómo funciona", en: "How it works" }
lab_hub_how_1_title: { es: "Sin archivos de audio", en: "No audio files" }
lab_hub_how_1_text: { es: "Bombo, clap, hats, bajo, acid y pads se sintetizan con Web Audio en tu navegador. No es música de Ailén: son herramientas para jugar.", en: "Kick, clap, hats, bass, acid and pads are synthesized with Web Audio in your browser. It is not Ailén's music: these are tools to play with." }
lab_hub_how_2_title: { es: "Nunca arranca solo", en: "Never starts on its own" }
lab_hub_how_2_text: { es: "El sonido empieza solo cuando tocás un botón, hay un silencio siempre a mano y todo se detiene si ocultás la pestaña o te vas de la página.", en: "Sound only starts when you press a button, mute is always at hand and everything stops if you hide the tab or leave the page." }
lab_hub_how_3_title: { es: "Privado por diseño", en: "Private by design" }
lab_hub_how_3_text: { es: "No hay cuentas ni servidores: los patrones viajan en el enlace, los flyers se dibujan en tu equipo y el micrófono, si lo activás, no se graba.", en: "No accounts, no servers: patterns travel in the link, flyers are drawn on your device and the microphone, if you turn it on, is never recorded." }

