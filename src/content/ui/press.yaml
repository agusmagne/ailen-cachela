press_rule_size_text:
  es: "No reducir el isotipo por debajo de 24 px en pantalla o 8 mm en papel."
  en: "Do not shrink the logo mark below 24 px on screen or 8 mm in print."
press_rule_colors_title: { es: "Colores", en: "Colours" }
press_rule_colors_text:
  es: "Usar solo las versiones de color, negro o blanco. No recolorear, no agregar sombras ni deformar."
  en: "Use only the colour, black or white versions. Do not recolour, add shadows or distort."
press_rule_photos_title: { es: "Sobre imágenes", en: "On images" }
press_rule_photos_text:
  es: "Sobre fotos, elegir la versión con más contraste y evitar zonas con mucho detalle detrás del isotipo."
  en: "On photos, pick the higher-contrast version and avoid busy areas behind the logo mark."

