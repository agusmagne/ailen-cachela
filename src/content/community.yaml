  - id: cita-02
    demo: true
    text: { es: "Otra cita inventada para mostrar el formato. No la dijo nadie.", en: "Another invented quote to show the format. Nobody said it." }
    author: { es: "Medio de ejemplo", en: "Example outlet" }
    context: { es: "Reseña de ejemplo", en: "Example review" }
  - id: cita-03
    demo: true
