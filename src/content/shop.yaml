# Plantilla de políticas: texto genérico A REVISAR por la artista y un profesional antes de vender algo real.
policies:
  - id: envios
    demo: true
    title: { es: "Envíos", en: "Shipping" }
    body:
      es:
        - "Plantilla a revisar. Todavía no hay envíos porque no hay ventas."
        - "Cuando existan, acá van los países y zonas, los plazos estimados y el costo, que se confirma por mail antes de pagar."
      en:
        - "Template to review. There is no shipping yet because nothing is for sale."
        - "Once there is, this will list countries and zones, estimated times and cost, confirmed by email before paying."
  - id: devoluciones
    demo: true
    title: { es: "Cambios y devoluciones", en: "Exchanges and returns" }
    body:
      es:
        - "Plantilla a revisar. Acá va el plazo para pedir un cambio, el estado en que debe volver el producto y quién paga el envío."
        - "Los plazos y derechos del consumidor se definen con asesoramiento profesional antes de vender."
      en:
        - "Template to review. This will state the window to request an exchange, the condition a product must come back in, and who pays shipping."
        - "Deadlines and consumer rights are defined with professional advice before selling."
  - id: pedidos
    demo: true
    title: { es: "Cómo se confirma un pedido", en: "How an order is confirmed" }
    body:
      es:
        - "Plantilla a revisar. El pedido es una consulta por mail: se responde con disponibilidad, precio final y forma de pago."
        - "Nada se cobra desde el sitio. Una consulta no reserva el producto."
      en:
        - "Template to review. An order is an email enquiry: the reply gives availability, final price and payment method."
        - "Nothing is charged from the site. An enquiry does not reserve the product."
  - id: ediciones
    demo: true
    title: { es: "Ediciones limitadas", en: "Limited editions" }
    body:
      es:
        - "Plantilla a revisar. Una tirada numerada no se reimprime; el número de copia se asigna al confirmar el pedido."
      en:
        - "Template to review. A numbered run is not reprinted; the copy number is assigned when the order is confirmed."
