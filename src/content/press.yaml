statement:
  - id: statement
    demo: true
    text:
      es: |-
        Busco que la pista sienta que algo se construye. Me interesa el techno como una forma de atención: el tiempo largo, la repetición que cambia apenas, el cuerpo que deja de pensar y empieza a escuchar.

        Trabajo con la tensión y con el silencio por igual. Creo que una buena noche se parece más a un paisaje que a una lista de temas, y que lo que une a las personas en una sala es el sonido que comparten.
      en: |-
        I want the floor to feel that something is being built. I am interested in techno as a form of attention: long time, repetition that changes only slightly, the body that stops thinking and starts listening.

        I work with tension and silence equally. I believe a good night is closer to a landscape than to a list of tracks, and that what brings people together in a room is the sound they share.

safer:
  - id: respect
    demo: true
    title: { es: "Respeto en la cabina y en la pista", en: "Respect in the booth and on the floor" }
    text:
      es: "Se pide a los espacios que tengan una política visible contra el acoso y la discriminación, y un canal claro para avisar si algo pasa."
      en: "Venues are asked to have a visible policy against harassment and discrimination, and a clear channel to report problems."
  - id: booth
    demo: true
    title: { es: "Cabina cuidada", en: "A cared-for booth" }
    text:
      es: "Acceso a la cabina limitado a quienes trabajan en el evento, y una persona de contacto del equipo durante todo el set."
      en: "Booth access limited to event staff, and one team contact available throughout the set."
  - id: travel
    demo: true
    title: { es: "Traslados seguros", en: "Safe travel" }
    text:
      es: "Para fechas nocturnas, un traslado seguro de ida y vuelta al alojamiento o a la casa, coordinado de antemano."
      en: "For night dates, safe round-trip transport to the hotel or home, arranged in advance."
  - id: consent
    demo: true
    title: { es: "Consentimiento con las imágenes", en: "Consent with images" }
    text:
      es: "Las fotos y los videos de la cabina se acuerdan con la artista; el material se publica con crédito y sin fines distintos a los pactados."
      en: "Photos and videos of the booth are agreed with the artist; material is published with credit and only for the purposes agreed."

