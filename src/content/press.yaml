bios:
  - id: medium
    demo: true
    text:
      es: |-
        Ailén Cachela es DJ y productora de Buenos Aires. Su trabajo se mueve en el techno: pulso firme, graves profundos y una atención casi obsesiva al detalle de cada transición. Co-fundadora de fragmento.techno, trabaja desde la cabina y desde el estudio con la misma idea: construir tensión despacio y soltarla en el momento justo.

        En 2017 sumó “Ahogo” (Original Mix) a Ellas EP [ROOM.004], la compilación del sello porteño ROOM. Desde entonces alterna fechas en clubes y fiestas con la producción de material propio y con SENKA, su proyecto artístico en desarrollo.

        Sus sets recorren la pista de punta a punta: arrancan contenidos, ganan densidad y terminan en un terreno hipnótico donde el volumen y el silencio pesan lo mismo. Disponible para clubes, festivales y eventos en Argentina y en el exterior.
      en: |-
        Ailén Cachela is a DJ and producer from Buenos Aires. Her work lives in techno: a steady pulse, deep low end and an almost obsessive attention to the detail of every transition. A co-founder of fragmento.techno, she works from the booth and from the studio with the same idea: build tension slowly and release it at exactly the right moment.

        In 2017 she added “Ahogo” (Original Mix) to Ellas EP [ROOM.004], the compilation from Buenos Aires label ROOM. Since then she has balanced club and party dates with producing her own material and with SENKA, her artistic project, still in development.

        Her sets cover the floor from end to end: they start restrained, gain density and finish in a hypnotic place where volume and silence weigh the same. Available for clubs, festivals and events in Argentina and abroad.
  - id: long
    demo: true
    text:
      es: |-
        Ailén Cachela es DJ y productora de Buenos Aires, Argentina. Su trabajo se mueve en el techno: pulso firme, graves profundos y una atención casi obsesiva al detalle de cada transición. Trabaja desde la cabina y desde el estudio con una sola idea: construir tensión despacio y soltarla en el momento justo.

        Es co-fundadora de fragmento.techno, un colectivo que piensa la fiesta como un espacio compartido antes que como un evento: la música, el sonido de la sala, la luz y las personas que la habitan cuentan por igual. Esa mirada colectiva marca también su forma de tocar, atenta a la pista y a cómo cambia a lo largo de la noche.

        En 2017 sumó “Ahogo” (Original Mix), un tema de casi ocho minutos, a Ellas EP [ROOM.004], la compilación del sello porteño ROOM, publicada en digital con formato de “pagás lo que quieras”. Desde entonces alterna fechas en clubes y fiestas con la producción de material propio y con SENKA, su proyecto artístico en desarrollo.

        Sus sets recorren la pista de punta a punta. Arrancan contenidos, con espacio para que la sala se acomode; ganan densidad de a poco; y terminan en un terreno hipnótico donde el volumen y el silencio pesan lo mismo. Prefiere los cierres largos y los cambios de energía que se sienten antes de que se escuchen.

        Fuera de la cabina, comparte su proceso de trabajo, enseña y colabora con otras personas de la escena local. Cree en las cabinas cuidadas, en los equipos de sonido bien calibrados y en las fiestas donde todas las personas se sienten seguras de bailar.

        Disponible para clubes, festivales y eventos en Argentina y en el exterior, en formato DJ set, live o híbrido.
      en: |-
        Ailén Cachela is a DJ and producer from Buenos Aires, Argentina. Her work lives in techno: a steady pulse, deep low end and an almost obsessive attention to the detail of every transition. She works from the booth and from the studio with a single idea: build tension slowly and release it at exactly the right moment.

        She is a co-founder of fragmento.techno, a collective that thinks of the party as a shared space before it is an event: the music, the sound of the room, the light and the people in it all count equally. That collective outlook shapes how she plays too, attentive to the floor and to how it changes through the night.

        In 2017 she added “Ahogo” (Original Mix), a track of almost eight minutes, to Ellas EP [ROOM.004], the compilation from Buenos Aires label ROOM, released digitally on a “name your price” basis. Since then she has balanced club and party dates with producing her own material and with SENKA, her artistic project, still in development.

        Her sets cover the floor from end to end. They start restrained, leaving room for the venue to settle; they gain density little by little; and they finish in a hypnotic place where volume and silence weigh the same. She favours long closings and shifts in energy that are felt before they are heard.

        Away from the booth she shares her working process, teaches and collaborates with other people in the local scene. She believes in well cared-for booths, properly calibrated sound systems and parties where everyone feels safe to dance.

        Available for clubs, festivals and events in Argentina and abroad, as a DJ set, live or hybrid performance.

