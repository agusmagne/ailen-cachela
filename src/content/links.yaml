# Link-in-bio (/links/). Los destinos reales salen de site.yaml (links, contacto) y del registro de rutas:
# acá solo se decide el orden, el rótulo y cuáles destacan. Una ruta aparece solo si la página existe y tiene contenido.
items:
  - id: escuchar
    kind: link
    ref: soundcloud
    label: { es: "Escuchar en SoundCloud", en: "Listen on SoundCloud" }
    hint: { es: "Mixes y tracks", en: "Mixes and tracks" }
    primary: true
